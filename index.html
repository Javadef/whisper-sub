<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whisper-sub</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0a;
  color: #ddd;
  font-family: 'Segoe UI', system-ui, monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Layout ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── Video ── */
#video-wrap {
  flex: 1;
  position: relative;
  background: #000;
  min-width: 0;
}
video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
#caption {
  position: absolute;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 92%;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  /* Container itself never hides; lines manage own opacity */
}
.cap-line {
  background: rgba(0,0,0,0.78);
  color: #fff;
  font-size: 1.45em;
  font-weight: 500;
  padding: 8px 20px;
  border-radius: 6px;
  text-align: center;
  text-shadow: 1px 1px 4px #000;
  line-height: 1.4;
  letter-spacing: 0.01em;
  opacity: 0;
  transform: translateY(28px) scale(0.97);
  transition: opacity 0.35s ease, transform 0.45s cubic-bezier(.2,.8,.2,1);
  white-space: pre-wrap;
  will-change: transform, opacity;
}
.cap-line.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.cap-line.fade-out {
  opacity: 0;
  transform: translateY(-22px) scale(0.97);
}
.cap-line.prev {
  opacity: 0.55;
  font-size: 1.15em;
  transform: translateY(0) scale(0.95);
}
#caption.hidden { opacity: 0; }

#play-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  pointer-events: none;
  z-index: 10;
}
#play-btn {
  background: rgba(0,0,0,0.72);
  border: 2px solid rgba(255,255,255,0.35);
  border-radius: 50%;
  width: 72px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2em;
  color: #fff;
  pointer-events: auto;
  cursor: pointer;
  transition: background 0.2s;
}
#play-btn:hover { background: rgba(0,0,0,0.92); }
#play-overlay.hidden { display: none; }
#fs-btn {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  border: none;
  border-radius: 4px;
  width: 32px;
  height: 32px;
  font-size: 1.1em;
  cursor: pointer;
  z-index: 20;
  opacity: 0.7;
  transition: opacity 0.2s;
}
#fs-btn:hover { opacity: 1; }
#video-wrap:fullscreen { background:#000; }
#video-wrap:fullscreen video { width:100%; height:100%; object-fit:contain; }
#video-wrap:fullscreen #fs-btn { display:none; }

/* ── Debug panel ── */
#debug {
  width: 360px;
  flex-shrink: 0;
  background: #111;
  border-left: 1px solid #1e1e1e;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#debug-header {
  padding: 10px 14px;
  background: #161616;
  border-bottom: 1px solid #1e1e1e;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78em;
  font-weight: 700;
  color: #888;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  flex-shrink: 0;
}
#ws-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #f44336;
  flex-shrink: 0;
  transition: background 0.3s;
}
#ws-dot.ok  { background: #4caf50; }
#ws-dot.warn { background: #ff9800; }

/* ── Stat grid ── */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1px;
  background: #1a1a1a;
  border-bottom: 1px solid #1a1a1a;
  flex-shrink: 0;
}
.stat {
  background: #111;
  padding: 9px 12px;
}
.stat-label {
  font-size: 0.65em;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.stat-value {
  font-size: 1.05em;
  font-weight: 700;
  color: #ddd;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.good  { color: #4caf50 !important; }
.warn  { color: #ff9800 !important; }
.bad   { color: #f44336 !important; }
.muted { color: #666    !important; }

/* ── Sliders ── */
.ctrl-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  border-bottom: 1px solid #181818;
  font-size: 0.78em;
  color: #666;
  flex-shrink: 0;
}
.ctrl-row label { flex-shrink: 0; min-width: 88px; }
.ctrl-row input[type=text] {
  flex: 1;
  background: #1a1a1a;
  border: 1px solid #2e2e2e;
  border-radius: 4px;
  color: #ddd;
  padding: 3px 8px;
  font-size: 0.85em;
  min-width: 0;
}
.ctrl-row input[type=text]:focus { outline: none; border-color: #4a90d9; }
.ctrl-row button {
  background: #1e3a5f;
  border: 1px solid #4a90d9;
  border-radius: 4px;
  color: #7bb8f5;
  padding: 3px 10px;
  cursor: pointer;
  font-size: 0.8em;
  flex-shrink: 0;
}
.ctrl-row button:hover { background: #2a4e7a; }
.ctrl-row span { min-width: 38px; text-align: right; color: #aaa; font-variant-numeric: tabular-nums; }

/* ── AJA device panel ── */
#aja-panel {
  border-bottom: 1px solid #181818;
  flex-shrink: 0;
}
#aja-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  font-size: 0.75em;
  color: #666;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid #181818;
}
#aja-header:hover { color: #aaa; }
#aja-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #444;
  flex-shrink: 0;
  transition: background 0.3s;
}
#aja-dot.found  { background: #4caf50; }
#aja-dot.none   { background: #f44336; }
#aja-dot.scan   { background: #ff9800; }
#aja-devices {
  display: none;
  flex-direction: column;
  gap: 1px;
  background: #161616;
  max-height: 140px;
  overflow-y: auto;
}
#aja-devices.open { display: flex; }
.dev-row {
  padding: 6px 14px;
  font-size: 0.75em;
  color: #bbb;
  cursor: pointer;
  background: #111;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.dev-row:hover { background: #1a2a1a; color: #7fd87f; }
.dev-row .dev-badge {
  font-size: 0.7em;
  color: #555;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* ── Caption log ── */
#log-wrap {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
}
#log-wrap::-webkit-scrollbar { width: 4px; }
#log-wrap::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

.log-entry {
  padding: 6px 14px;
  border-bottom: 1px solid #161616;
}
.log-meta {
  font-size: 0.68em;
  color: #444;
  margin-bottom: 2px;
  font-variant-numeric: tabular-nums;
}
.log-text {
  font-size: 0.82em;
  color: #bbb;
  line-height: 1.45;
}
.log-entry.is-error .log-text { color: #f44336; }
.log-entry.is-error .log-meta { color: #8b3333; }
.log-entry.is-init .log-text  { color: #4a90d9; }

/* ── Error banner ── */
#err-banner {
  display: none;
  padding: 7px 14px;
  background: #2a0a0a;
  border-top: 1px solid #f44336;
  font-size: 0.75em;
  color: #f44336;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>

<div id="main">

  <!-- Video + caption -->
  <div id="video-wrap">
    <video id="video" controls controlslist="nofullscreen" playsinline muted autoplay></video>
    <button id="fs-btn" title="Fullscreen">&#x26F6;</button>
    <div id="play-overlay">
      <div id="play-btn">&#9654;</div>
    </div>
    <div id="caption"></div>
  </div>

  <!-- Debug panel -->
  <div id="debug">
    <div id="debug-header">
      <div id="ws-dot"></div>
      whisper-sub debug
    </div>

    <div class="stat-grid">
      <div class="stat">
        <div class="stat-label">Status</div>
        <div class="stat-value muted" id="s-ws">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Language</div>
        <div class="stat-value" id="s-lang">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Lag</div>
        <div class="stat-value" id="s-lag">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Avg Lag×10</div>
        <div class="stat-value" id="s-lag-avg">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Chunks</div>
        <div class="stat-value" id="s-chunks">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Clients</div>
        <div class="stat-value" id="s-clients">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Model</div>
        <div class="stat-value" id="s-model">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Device</div>
        <div class="stat-value" id="s-device">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Compute</div>
        <div class="stat-value" id="s-compute">—</div>
      </div>
    </div>

    <!-- Stream URL input -->
    <div class="ctrl-row">
      <label for="inp-stream">Stream URL</label>
      <input type="text" id="inp-stream" placeholder="HLS .m3u8 URL" spellcheck="false">
      <button id="btn-stream">Load</button>
    </div>

    <!-- AJA / capture device panel -->
    <div id="aja-panel">
      <div id="aja-header">
        <div id="aja-dot"></div>
        <span id="aja-title">AJA / Capture Devices</span>
        <button id="btn-scan" style="margin-left:auto;background:#1a2e1a;border:1px solid #3a6e3a;border-radius:4px;color:#7fd87f;padding:2px 9px;cursor:pointer;font-size:0.9em;">Scan</button>
      </div>
      <div id="aja-devices"></div>
    </div>

    <!-- Caption fine sync slider -->
    <div class="ctrl-row">
      <label for="sl-delay">Caption sync</label>
      <input type="range" id="sl-delay" min="-5" max="5" step="0.1" value="0">
      <span id="vl-delay">0.0s</span>
    </div>

    <!-- Font size slider -->
    <div class="ctrl-row">
      <label for="sl-font">Caption size</label>
      <input type="range" id="sl-font" min="0.8" max="2.8" step="0.1" value="1.45">
      <span id="vl-font">1.5em</span>
    </div>

    <!-- Volume slider -->
    <div class="ctrl-row">
      <label for="sl-vol">Volume</label>
      <input type="range" id="sl-vol" min="0" max="100" step="1" value="80">
      <span id="vl-vol">80%</span>
    </div>

    <!-- Video delay slider -->
    <div class="ctrl-row">
      <label for="sl-vdelay">Video delay</label>
      <input type="range" id="sl-vdelay" min="6" max="120" step="1" value="12">
      <span id="vl-vdelay">12s</span>
    </div>

    <!-- Log -->
    <div id="log-wrap">
      <div id="log"></div>
    </div>

    <div id="err-banner"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
const STREAM = "http://hls.mirtv.cdnvideo.ru/mirtv-parampublish/mir24_2500/playlist.m3u8";
const WS_URL = "ws://localhost:8765";
let videoDelay = 12; // seconds behind live edge

// ── Stream URL input ─────────────────────────────────────────────────────────────────────
let activeStream = STREAM;

function loadStream(url) {
  if (!url) return;
  const urlChanged = url !== activeStream;
  activeStream = url;

  if (urlChanged) {
    if (Hls.isSupported()) {
      if (window._hls) { window._hls.destroy(); }
      const hls = new Hls({ enableWorker: true, lowLatencyMode: false, liveSyncDuration: videoDelay, liveMaxLatencyDuration: videoDelay * 4, backBufferLength: videoDelay * 2 });
      window._hls = hls;
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    } else {
      video.src = url;
      video.play().catch(() => {});
    }
  }

  // Always tell backend — resets _active_language even for same URL
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "set_stream", url }));
  }
  addLog(new Date().toLocaleTimeString(), `stream → ${url}`, "init");
}

const inpStream = document.getElementById("inp-stream");
const btnStream = document.getElementById("btn-stream");
inpStream.value = STREAM;
btnStream.addEventListener("click", () => loadStream(inpStream.value.trim()));
inpStream.addEventListener("keydown", e => { if (e.key === "Enter") loadStream(inpStream.value.trim()); });

// ── Video ─────────────────────────────────────────────────────────────────────
const video = document.getElementById("video");
const playOverlay = document.getElementById("play-overlay");

function tryPlay() {
  video.play().then(() => {
    playOverlay.classList.add("hidden");
  }).catch(() => {});
}

playOverlay.addEventListener("click", tryPlay);
video.addEventListener("play", () => playOverlay.classList.add("hidden"));
video.addEventListener("pause", () => {
  if (!video.seeking) playOverlay.classList.remove("hidden");
});

// ── Fullscreen via custom button ──
const videoWrap = document.getElementById("video-wrap");
document.getElementById("fs-btn").addEventListener("click", () => {
  if (!document.fullscreenElement) {
    videoWrap.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener("fullscreenchange", () => {
  const btn = document.getElementById("fs-btn");
  if (btn) btn.textContent = document.fullscreenElement ? "\u2716" : "\u26F6";
});

video.addEventListener("volumechange", () => {
  if (!video.muted && video.paused) video.play().catch(() => {});
});

if (Hls.isSupported()) {
  const hls = new Hls({ enableWorker: true, lowLatencyMode: false, liveSyncDuration: videoDelay, liveMaxLatencyDuration: videoDelay * 4, backBufferLength: videoDelay * 2 });
  window._hls = hls;
  hls.loadSource(STREAM);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    video.play().then(() => {
      playOverlay.classList.add("hidden");
    }).catch(() => {
      playOverlay.classList.remove("hidden");
    });
  });
} else if (video.canPlayType("application/vnd.apple.mpegurl")) {
  video.src = STREAM;
  video.play().then(() => {
    playOverlay.classList.add("hidden");
  }).catch(() => {
    playOverlay.classList.remove("hidden");
  });
}

// ── Caption overlay (wallclock-synced + rolling slide/fade) ─────────────────
const capEl = document.getElementById("caption");
let captionFineSync = 0;       // ±5s nudge for lip-sync
let serverOffsetMs  = 0;       // server_wall_ms - client_wall_ms (updated on each msg)
let chunkSec        = 5;       // length of audio window per caption (from server)
let capFontEm       = 1.45;    // current font size, applied to new lines

const WORDS_PER_CHUNK = 8;
const MS_PER_WORD     = 360;   // ~166 wpm reading rate
const MIN_HOLD_MS     = 1300;
const MAX_HOLD_MS     = 6000;
const FADE_MS         = 350;   // CSS transition length

/**
 * Schedule a caption to appear at the moment the video frame matching
 * its source audio is shown on screen.
 *
 *   chunk covers audio  [audio_t - chunkSec  ..  audio_t]   (server wall)
 *   video plays  videoDelay  seconds behind live edge
 *   ⇒ chunk START heard at  (audio_t - chunkSec) + videoDelay  (server wall)
 *   ⇒ client time:          audio_t - chunkSec + videoDelay - serverOffset
 */
function scheduleCaption(text, audio_t /* sec, server wall */) {
  const words = text.trim().split(/\s+/).filter(Boolean);
  if (!words.length) return;

  const groups = [];
  for (let i = 0; i < words.length; i += WORDS_PER_CHUNK) {
    groups.push(words.slice(i, i + WORDS_PER_CHUNK).join(' '));
  }

  const startClientMs =
      (audio_t - chunkSec) * 1000
      + videoDelay * 1000
      + captionFineSync * 1000
      - serverOffsetMs;

  const evenHold = (chunkSec * 1000) / groups.length;
  let cursor = startClientMs - Date.now();

  groups.forEach(txt => {
    const hold = Math.max(MIN_HOLD_MS, Math.min(MAX_HOLD_MS, evenHold));
    const fireAt = Math.max(0, cursor);
    setTimeout(() => pushCaption(txt, hold), fireAt);
    cursor = fireAt + hold;
  });
}

/**
 * Rolling caption: keep most-recent line as primary, demote previous to
 * smaller "prev" line above. Lines fade/slide; nothing blanks abruptly.
 */
let currentLine = null;   // active .cap-line element
let prevLine    = null;   // previous .cap-line element (smaller, dimmer)
let currentHideTimer = null;

function pushCaption(text, holdMs) {
  // 1. Demote currentLine → prevLine
  if (prevLine) {
    // Fade out the older prev line
    const dying = prevLine;
    dying.classList.add("fade-out");
    dying.classList.remove("prev", "show");
    setTimeout(() => dying.remove(), FADE_MS + 50);
    prevLine = null;
  }
  if (currentLine) {
    if (currentHideTimer) { clearTimeout(currentHideTimer); currentHideTimer = null; }
    currentLine.classList.remove("show");
    currentLine.classList.add("prev");
    prevLine = currentLine;
  }

  // 2. Build new line, insert at bottom (after prev), animate in
  const line = document.createElement("div");
  line.className = "cap-line";
  line.style.fontSize = capFontEm + "em";
  line.textContent = text;
  capEl.appendChild(line);
  // Force reflow then add show class → triggers transition
  void line.offsetWidth;
  line.classList.add("show");
  currentLine = line;

  // 3. Schedule fade-out of this line if no successor arrives in holdMs
  currentHideTimer = setTimeout(() => {
    if (line === currentLine) {
      line.classList.add("fade-out");
      line.classList.remove("show");
      setTimeout(() => {
        if (line === currentLine) { currentLine = null; }
        line.remove();
      }, FADE_MS + 50);
    }
  }, holdMs);
}

function showCaption(text, audio_t) {
  if (audio_t) scheduleCaption(text, audio_t);
  else pushCaption(text, 3000);
}

const CHUNK_SEC = 3;

// ── Sliders ───────────────────────────────────────────────────────────────────
function mkSlider(id, valId, suffix, onChange) {
  const sl = document.getElementById(id);
  const vl = document.getElementById(valId);
  const upd = () => { vl.textContent = parseFloat(sl.value).toFixed(1) + suffix; onChange(parseFloat(sl.value)); };
  sl.addEventListener("input", upd);
  upd();
}
mkSlider("sl-delay", "vl-delay", "s",  v => captionFineSync = v);
mkSlider("sl-font",  "vl-font",  "em", v => {
  capFontEm = v;
  document.querySelectorAll(".cap-line").forEach(el => el.style.fontSize = v + "em");
});
(function() {
  const sl = document.getElementById("sl-vdelay");
  const vl = document.getElementById("vl-vdelay");
  sl.addEventListener("input", () => {
    videoDelay = parseInt(sl.value);
    vl.textContent = videoDelay + "s";
    // Rebuild HLS with new delay
    if (Hls.isSupported()) {
      if (window._hls) { window._hls.destroy(); }
      const hls = new Hls({ enableWorker: true, lowLatencyMode: false, liveSyncDuration: videoDelay, liveMaxLatencyDuration: videoDelay * 4, backBufferLength: videoDelay * 2 });
      window._hls = hls;
      hls.loadSource(activeStream);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    }
  });
})();
(function() {
  const sl = document.getElementById("sl-vol");
  const vl = document.getElementById("vl-vol");
  video.volume = parseFloat(sl.value) / 100;
  vl.textContent = parseFloat(sl.value).toFixed(1) + "%";
  sl.addEventListener("input", () => {
    const v = parseFloat(sl.value);
    vl.textContent = v.toFixed(1) + "%";
    video.volume = v / 100;
    video.muted = (v === 0);
    if (v > 0 && video.paused) tryPlay();
  });
})();

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function set(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "stat-value" + (cls ? " " + cls : "");
}
function lagClass(v) {
  if (v <  2) return "good";
  if (v <  6) return "warn";
  return "bad";
}

// ── Log ───────────────────────────────────────────────────────────────────────
const logEl  = document.getElementById("log");
const MAX_LOG = 120;
function addLog(meta, text, type) {
  const entry = document.createElement("div");
  entry.className = "log-entry" + (type === "error" ? " is-error" : type === "init" ? " is-init" : "");
  entry.innerHTML = `<div class="log-meta">${esc(meta)}</div><div class="log-text">${esc(text)}</div>`;
  logEl.prepend(entry);
  while (logEl.children.length > MAX_LOG) logEl.lastChild.remove();
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
const wsDot    = document.getElementById("ws-dot");
let ws = null;
let reconnTimer = null;

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    wsDot.className = "ok";
    set("s-ws", "connected", "good");
    clearTimeout(reconnTimer);
    if (activeStream !== STREAM) {
      ws.send(JSON.stringify({ type: "set_stream", url: activeStream }));
    }
  };
  ws.onclose = () => {
    wsDot.className = "warn";
    set("s-ws", "reconnecting…", "warn");
    reconnTimer = setTimeout(connect, 2000);
  };
  ws.onerror = () => {
    set("s-ws", "error", "bad");
  };

  ws.onmessage = evt => {
    let msg;
    try { msg = JSON.parse(evt.data); } catch { return; }

    // Update server↔client clock offset on any msg carrying server_now
    if (msg.server_now !== undefined) {
      serverOffsetMs = msg.server_now * 1000 - Date.now();
    }

    if (msg.lang    !== undefined) set("s-lang",    msg.lang,          msg.lang !== "?" ? "good" : "muted");
    if (msg.lag     !== undefined) set("s-lag",     msg.lag + "s",     lagClass(msg.lag));
    if (msg.lag_avg !== undefined) set("s-lag-avg", msg.lag_avg + "s", lagClass(msg.lag_avg));
    if (msg.chunks  !== undefined) set("s-chunks",  msg.chunks);
    if (msg.model   !== undefined) set("s-model",   msg.model);
    if (msg.device  !== undefined) set("s-device",  msg.device);
    if (msg.compute !== undefined) set("s-compute", msg.compute);

    if (msg.type === "init") {
      if (msg.chunk_sec) chunkSec = msg.chunk_sec;
      addLog(new Date().toLocaleTimeString(), `connected · ${msg.device} / ${msg.model} / ${msg.compute}`, "init");
    }

    if (msg.type === "caption" && msg.text) {
      const meta = `${new Date().toLocaleTimeString()}  [${msg.lang}]  lag ${msg.lag}s  avg ${msg.lag_avg}s  #${msg.chunks}`;
      addLog(meta, msg.text);
      showCaption(msg.text, msg.audio_t);
    }

    if (msg.type === "stream_changed" && msg.url) {
      inpStream.value = msg.url;
      activeStream    = msg.url;
      addLog(new Date().toLocaleTimeString(), `backend stream → ${msg.url}`, "init");
    }

    if (msg.type === "error") {
      addLog(new Date().toLocaleTimeString() + "  ERROR", msg.msg, "error");
      const banner = document.getElementById("err-banner");
      banner.style.display = "block";
      banner.textContent = msg.msg;
      setTimeout(() => banner.style.display = "none", 8000);
    }
  };
}

connect();

// ── AJA / Capture device panel ────────────────────────────────────────────────
const ajaDot     = document.getElementById("aja-dot");
const ajaDevs    = document.getElementById("aja-devices");
const ajaTitle   = document.getElementById("aja-title");
const ajaHeader  = document.getElementById("aja-header");
const btnScan    = document.getElementById("btn-scan");
let ajaOpen = false;

ajaHeader.addEventListener("click", e => {
  if (e.target === btnScan) return;
  ajaOpen = !ajaOpen;
  ajaDevs.classList.toggle("open", ajaOpen);
});

btnScan.addEventListener("click", e => {
  e.stopPropagation();
  ajaDot.className = "scan";
  ajaTitle.textContent = "Scanning…";
  ajaDevs.innerHTML = "";
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "scan_devices" }));
  }
});

// Handle devices message from server
const _origOnMessage = ws ? null : null;
function handleDevicesMsg(msg) {
  if (msg.type !== "devices") return;

  const boards = msg.aja_boards || [];
  const ajaAudio = msg.aja_dshow_audio || [];
  const ajaVideo = msg.aja_dshow_video || [];
  const allDshow = (msg.dshow && msg.dshow.audio) ? msg.dshow.audio : [];

  const total = boards.length + ajaAudio.length + ajaVideo.length;
  ajaDot.className = total > 0 ? "found" : "none";
  ajaTitle.textContent = total > 0
    ? `AJA / Capture — ${total} device${total > 1 ? "s" : ""} found`
    : "AJA / Capture — none found";

  ajaDevs.innerHTML = "";
  ajaOpen = true;
  ajaDevs.classList.add("open");

  // NTV2 boards
  boards.forEach(b => {
    addDevRow(`${b.name}  (board #${b.index})`, "NTV2", () => {
      // Use first matching dshow audio device if present
      const match = ajaAudio[0] || null;
      if (match) useAudioDevice(match);
      else alert("NTV2 board found but no matching DirectShow audio device detected.\nInstall AJA Desktop Software to expose dshow audio.");
    });
  });

  // AJA DirectShow audio inputs
  ajaAudio.forEach(d => {
    addDevRow(d, "SDI audio", () => useAudioDevice(d));
  });

  // AJA DirectShow video inputs
  ajaVideo.forEach(d => {
    addDevRow(d, "SDI video", () => {});
  });

  // If nothing AJA found, show all audio devices as fallback
  if (total === 0) {
    allDshow.slice(0, 8).forEach(d => {
      addDevRow(d, "audio", () => useAudioDevice(d));
    });
  }
}

function addDevRow(name, badge, onClick) {
  const row = document.createElement("div");
  row.className = "dev-row";
  row.innerHTML = `<span>${esc(name)}</span><span class="dev-badge">${esc(badge)}</span>`;
  row.addEventListener("click", onClick);
  ajaDevs.appendChild(row);
}

function useAudioDevice(deviceName) {
  const url = "dshow://" + deviceName;
  document.getElementById("inp-stream").value = url;
  loadStream(url);
}

// Patch ws.onmessage to also handle devices
const _origConnect = connect;
(function patchWs() {
  const interval = setInterval(() => {
    if (!ws) return;
    const orig = ws.onmessage;
    ws.onmessage = evt => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { if (orig) orig(evt); return; }
      if (msg.type === "devices") { handleDevicesMsg(msg); return; }
      if (orig) orig(evt);
    };
    clearInterval(interval);
  }, 100);
})();
</script>
